services:
  db:
    image: mariadb:10.6
    environment:
      MYSQL_DATABASE: hotcrp
      MYSQL_USER: hotcrp
      MYSQL_PASSWORD: hotcrppwd
      MYSQL_ROOT_PASSWORD: rootpw
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mariadb.cnf:/etc/mysql/conf.d/hotcrp.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  php:
    build:
      context: ./docker
      dockerfile: Dockerfile.php
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/var/www/html:cached
    # php-fpm listens on 9000

  web:
    image: nginx:alpine
    depends_on:
      - php
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  dbdata:
