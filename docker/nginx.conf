events {}

http {
  server {
    listen 8080;
    server_name localhost;

    root /var/www/html;    # this will be the hotcrp repo root
    index index.php;

    # Serve static assets directly (README says these are safe)
    location ~ ^/(images|scripts|stylesheets)/ {
      try_files $uri =404;
    }

    # Everything else -> PHP/HotCRP front controller
    location / {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
      # Provide PATH_INFO (HotCRP uses it)
      fastcgi_split_path_info ^(/)(.*)$;
      fastcgi_param PATH_INFO $fastcgi_path_info;
      fastcgi_pass php:9000;
    }
  }
}
